server.port=${PORT:10000}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.demo-mode=false
app.auth.required=true
app.auth.access-key=${DEPLOYMENT_ACCESS_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.credits-file=${STORAGE_DIR:/var/data/storage}/exports/CREDITS.md
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=32
server.tomcat.accept-count=16
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
