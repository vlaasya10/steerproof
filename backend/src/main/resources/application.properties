spring.application.name=steerproof-backend

# Server
server.port=8080
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=130MB

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/steerproof}
spring.datasource.username=${DB_USER:steer}
spring.datasource.password=${DB_PASSWORD:steer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Storage & Services
app.storage.dir=${STORAGE_DIR:../storage}
app.ml-service.url=${ML_SERVICE_URL:http://localhost:8001}
app.render-service.url=${RENDER_SERVICE_URL:http://localhost:8002}
app.demo-mode=${DEMO_MODE:true}

# Actuator
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.auth.access-key=${DEPLOYMENT_ACCESS_KEY:}
app.processing.mode=${PROCESSING_MODE:full}
app.storage.ephemeral=${STORAGE_EPHEMERAL:false}
